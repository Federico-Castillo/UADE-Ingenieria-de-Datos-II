site_name: Ingeniería de Datos II
site_description: Apuntes de clase, materiales y ejercicios de Ingeniería de Datos II (UADE)
site_author: Federico Castillo
site_url: https://federico-castillo.github.io/UADE-Ingenieria-de-Datos-II/

repo_name: UADE-Ingenieria-de-Datos-II
repo_url: https://github.com/Federico-Castillo/UADE-Ingenieria-de-Datos-II
edit_uri: edit/main/docs/

copyright: Apuntes personales — Ingeniería de Datos II, UADE

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      title: En esta página
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Información de la materia:
      - info-materia/index.md
      - Cronograma: info-materia/cronograma.md
      - Bibliografía oficial: info-materia/bibliografia.md
  - Clases:
      - clases/index.md
      - "Clase 1": clases/clase-01.md
      - "Clase 2": clases/clase-02.md
      - "Clase 3": clases/clase-03.md
      - "Clase 4": clases/clase-04.md
  - Materiales: materiales/index.md
  - Ejercicios:
      - ejercicios/index.md
      - Ejercicios de teoría: ejercicios/teoria.md
      - Ejercicios de práctica: ejercicios/practica.md
